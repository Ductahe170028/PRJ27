# GameCreator — Nginx is the only public entry point.
#
# Install once, inside the http { } context (Ubuntu includes
# sites-enabled there). Do not also copy this file into conf.d/.
#
#   sudo cp deploy/nginx/gamecreator.conf /etc/nginx/sites-available/gamecreator.conf
#   sudo ln -s /etc/nginx/sites-available/gamecreator.conf /etc/nginx/sites-enabled/gamecreator.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#
# Do not enable this site until a real certificate exists and server_name
# is the real domain. Do not serve Basic Auth on public HTTP.
# The password file is /etc/nginx/.htpasswd-gamecreator and is not in git.
# See deploy/README.md.

limit_req_zone $binary_remote_addr zone=gc_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=gc_site:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=gc_conn:10m;

# If nginx reports "address family not supported", comment out every listen [::] line.
# Port 80 only redirects. It does not ask for a password and does not
# proxy to Node, so credentials are never sent in clear text and this
# listener cannot skip the password on port 443.
server {
    listen 80;
    listen [::]:80;
    server_name gamecreator.example.com;

    # Empty directory used only for the Let's Encrypt HTTP-01 challenge.
    # Not the application, and not an exception on the HTTPS server.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # The listen parameter matches Ubuntu 24.04 (nginx 1.24) and still loads on newer nginx.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gamecreator.example.com;
    server_tokens off;

    # Replace both paths with the real certificate after it is issued.
    # Do not commit the files and do not generate a stand-in certificate.
    ssl_certificate     /etc/nginx/ssl/gamecreator/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/gamecreator/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:GameCreatorTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Inherited by every location below. Do not turn this off in a location.
    auth_basic "GameCreator";
    auth_basic_user_file /etc/nginx/.htpasswd-gamecreator;

    root /var/www/gamecreator;
    index index.html;
    client_max_body_size 16k;

    access_log /var/log/nginx/gamecreator.access.log;
    error_log  /var/log/nginx/gamecreator.error.log warn;

    # Throttles password guessing on the website itself, including bad
    # passwords. Counted per IP before the password is checked. /api/ below
    # has its own stricter limit and does not use this one.
    limit_req zone=gc_site burst=40 nodelay;
    limit_req_status 429;

    # Prefix match, so every API is covered, including
    # /api/games/generate, /api/ai/test-connection and /api/agent/generate.
    # ^~ stops a later regex from taking the request away from this proxy.
    # A nested or sibling location does not inherit these proxy lines;
    # keep one block instead of copying it per endpoint.
    location ^~ /api/ {
        limit_req zone=gc_api burst=10 nodelay;
        limit_req_status 429;
        limit_conn gc_conn 8;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # Always the configured domain from server_name, never the Host the
        # client typed. A client cannot make Node see "localhost". Do not
        # rewrite this to localhost or 127.0.0.1.
        proxy_set_header Host $server_name;
        # Keep the browser Origin. Never clear it.
        proxy_set_header Origin $http_origin;
        # Drop the shared Basic Auth secret before it reaches Node.
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        # Only the real TCP peer. Never pass on a client-supplied value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Express (trust proxy) would read these from a client. Nginx passes
        # unknown client headers through unless they are cleared here.
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";

        # Agent responses are NDJSON. Buffering would hold the stream. A job
        # waits at most 60s in the queue and runs at most 240s (GAME_JOB_*
        # defaults; their sum is capped at 300s) and the browser waits 330s.
        # proxy_read_timeout must stay above the longest silent gap (the wait).
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
